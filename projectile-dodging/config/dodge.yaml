# Projectile dodging configuration.
# Units: metres, seconds, degrees. Frame: base_link (x forward, y left, z up,
# origin on the centre plane at hip-axis height).
# Calibration tools never edit this file: they write config/calib/*.yaml, which
# is merged over it at load time (same keys, later files win).

ball:
  diameter_m: 0.074        # measure one with calipers
  mass_kg: 0.026           # 0.917 oz
  drag_cd: 0.47

robot:
  # Body outline used for the "will it hit" test, including head, mics and camera mount.
  box: {x_min: -0.15, x_max: 0.17, y_min: -0.12, y_max: 0.12, z_top: 0.19}
  hip_height_m: 0.13       # standing height of the hip axes above the floor (measure)

cameras:
  fisheye:
    enabled: true
    source: ros_compressed            # frames from camera_ros (the course camera node)
    topic: /camera/image_raw/compressed
    model: double_sphere
    # follow_me_pupper/robot/camera_params.yaml, valid for 1400 x 1050 frames
    intrinsics: {fx: 228.8103, fy: 228.8103, cx: 680.0, cy: 479.0, xi: -0.00092, alpha: 0.62007, width: 1400, height: 1050}
    extrinsics: {x: 0.1579, y: 0.0, z: -0.0015, yaw_deg: 0.0, pitch_deg: 0.0, roll_deg: 0.0}
    max_angle_deg: 100.0
    # The lit disc of the lens in a 1400 x 1050 frame. Everything beyond r * (1 - margin_frac) from its
    # centre is ignored: the rim of the lens splits colours, and part of that fringe is ball-green.
    # Measure it on your robot: tools/fit_image_circle.py fisheye --write
    image_circle: {cx: 705.0, cy: 523.0, r: 390.0, margin_frac: 0.11}
    min_elevation_deg: -30.0          # ignore things on the floor right at the robot's feet
    time_offset_s: -0.04              # added to the frame stamp; from tools/measure_latency.py
    size_by_width: true               # this camera's exposure is long in lamp light (about 20 ms) and smears a moving ball
                                      # into a streak: size the ball by the streak's width, not its area
    colour_gains: [1.4, 3.3]          # fixed white balance [red, blue] the launch file sets (auto leaves this camera pink)
    size_scale: 1.0                   # apparent-size corrections; from tools/calibrate_color.py --distance
    size_offset_px: 0.4               # blobs come out about this much too wide
    bearing_sigma_deg: 0.35
    size_sigma_px: 0.5
    # Ball colour, OpenCV HSV (H 0-179), judged after the picture's colour cast has been taken out
    # (detector.balance). These are starting values for an uncalibrated camera; tools/calibrate_color.py
    # replaces them for the room. A pixel is ball-coloured when its hue is in range, its saturation is
    # at least s_min, its brightness at least v_min, and its colourfulness (saturation x brightness / 255)
    # at least c_min. A patch of such pixels only counts if some of them also reach c_seed.
    color: {h_min: 32, h_max: 72, s_min: 50, s_max: 255, v_min: 45, v_max: 255, c_min: 32, c_seed: 45}
  elp_left:
    enabled: true
    source: v4l2
    device: ""                        # set with tools/find_cameras.py (a /dev/v4l/by-path/... name)
    # exposure_100us: exposure in units of 0.1 ms (30 = 3 ms; short, so a thrown ball does not smear).
    # gain: null leaves the camera's own, which is far too dark indoors at 3 ms. Do not edit these by hand:
    # tools/tune_exposure.py finds exposure, gain and white balance for the room and writes config/calib/exposure.yaml.
    # wb_temperature: a fixed colour temperature in kelvin, or auto. controls: any other v4l2-ctl control by name, e.g. {gamma: 120}.
    capture: {width: 1280, height: 720, fps: 120, exposure_100us: 30, gain: null, auto_exposure: false, wb_temperature: 4600, controls: {}}
    # Most frames looked at per second. The camera delivers about 43 a second on the Pupper (it is asked for more),
    # and a limit of 30 then means every second frame, 21 a second. 45 takes every frame it delivers; the camera's
    # process simply skips frames while it is busy, so a limit above what the Pi manages costs no delay.
    max_process_fps: 45
    model: pinhole
    intrinsics: {hfov_deg: 120.0, width: 1280, height: 720}   # replaced by tools/calibrate_camera.py
    extrinsics: {x: 0.0450, y: 0.0315, z: 0.1521, yaw_deg: 122.5, pitch_deg: 0.0, roll_deg: 0.0}
    max_angle_deg: 75.0
    min_elevation_deg: -15.0          # the robot's own back, ears and mics sit below this
    time_offset_s: -0.03
    size_scale: 1.0
    size_offset_px: 0.4
    bearing_sigma_deg: 0.25
    size_sigma_px: 0.4
    color: {h_min: 32, h_max: 72, s_min: 50, s_max: 255, v_min: 45, v_max: 255, c_min: 32, c_seed: 45}
  elp_right:
    enabled: true
    source: v4l2
    device: ""
    capture: {width: 1280, height: 720, fps: 120, exposure_100us: 30, gain: null, auto_exposure: false, wb_temperature: 4600, controls: {}}
    max_process_fps: 45
    model: pinhole
    intrinsics: {hfov_deg: 120.0, width: 1280, height: 720}
    extrinsics: {x: 0.0450, y: -0.0315, z: 0.1521, yaw_deg: -122.5, pitch_deg: 0.0, roll_deg: 0.0}
    max_angle_deg: 75.0
    min_elevation_deg: -15.0
    time_offset_s: -0.03
    size_scale: 1.0
    size_offset_px: 0.4
    bearing_sigma_deg: 0.25
    size_sigma_px: 0.4
    color: {h_min: 32, h_max: 72, s_min: 50, s_max: 255, v_min: 45, v_max: 255, c_min: 32, c_seed: 45}

detector:
  min_area_px: 10          # about 3.6 px across; never smaller than this
  max_range_m: 3.0         # the farthest the ball can be when it matters (2 m throws: 3 m leaves a margin). Patches
                           # smaller than 0.6 x the ball's width at this range are ignored: most stray noise is that small.
                           # Raise it if you throw from further away.
  far_ball_margin: 0.6
  max_area_frac: 0.25
  open_px: 3               # morphological open kernel (0 = off)
  max_aspect: 2.8          # long side / short side; a 120 deg rectilinear lens stretches the ball near the image edge
  min_fill: 0.5            # small patches (under shape_min_area_px): area / area of the oval in its bounding box
  shape_min_area_px: 80    # from this size up, a patch's shape is judged by the three numbers below
  min_solidity: 0.72       # area / area of its convex outline: a ball has no big dents or holes; clothing and floor patches do
  min_ellipse_fill: 0.78   # filled outline / best-fitting oval: 1.0 for a disc or oval, 0.64 for a triangle
  max_fill: 1.15           # same number, upper limit: 1.27 for a box
  max_candidates: 150      # patches judged per frame, largest first
  seed_frac: 0.15          # share of a patch's pixels that must clear the colour profile's higher bar (c_seed)
  # Before the colour tests each picture's colour cast is taken out: blue and red are scaled so the bright,
  # colourless parts of the room come out neutral. The ball's colour then no longer depends on the camera's
  # white balance. every: frames between updates; rate: how far each update moves toward the new estimate.
  balance: {enabled: true, every: 20, rate: 0.35}
  max_blobs: 10
  # A whole-frame search first looks at every coarse_step-th pixel across and down, then measures at full
  # resolution only the places that showed ball colour. Same blobs, about a third of the work. 1 = off.
  coarse_step: 2
  coarse_min_px: 60000     # search areas smaller than this (the region around a tracked ball) are done directly
  coarse_need: 0.7         # a place counts if it shows this share of the pixels the smallest ball would (specks do not)
  max_places: 60           # a coarse search hands on at most this many places, the ones with most colour first
  max_measured: 12         # ... of which, once the still ones are left out, at most this many are measured per picture
  sparse_min_px: 600       # a place whose box covers at least this many pixels and is less than sparse_fill full of
  sparse_fill: 0.2         # colour is a scatter of specks, not a ball, and is not looked at further
  max_per_window: 8        # patches judged within one place, largest first
  decode_small_first: true # decode each JPEG at 1/coarse_step size first (a third of the cost) and decode the full
                           # picture only when that shows ball colour somewhere it has not been sitting all along
  full_decode_frames: 6    # ... and after a picture that showed something, decode this many in full straight away
  # Blobs that have sat in one place in the picture are not passed on to the tracker: balls already thrown,
  # anything else of the ball's colour. Still = seen there for after_s, and over the last window_s neither moved
  # (more than move_px pixels or move_diameters of its width) nor grown (by more than the factor grow).
  # Also: a square of the picture (cell_px wide) that has had a blob in it for more than busy_level of the last
  # busy_s seconds reports no more, unless one is busy_bigger times wider than usual there. That is for things
  # whose colour shows in bits that come and go (a drying rack, a patterned mat). busy_level 0 = off.
  still: {enabled: true, after_s: 1.0, window_s: 0.5, move_px: 6.0, move_diameters: 0.5, grow: 1.2, forget_s: 1.5,
          cell_px: 48, busy_s: 2.0, busy_level: 0.3, busy_bigger: 1.6}
  roi_tracking: true       # while a ball is tracked, look near its predicted position first
  roi_half_deg: 14.0
  roi_min_px: 96
  full_frame_every: 3      # still scan the whole frame every Nth frame while tracking

tracker:
  accel_sigma: 2.0         # m/s^2, unmodelled acceleration (drag error, size-range bias, robot motion)
  pos_walk_sigma: 0.03     # m/sqrt(s)
  init_speed_sigma: 7.0    # m/s, prior on the unknown velocity of a new track
  gate_chi2: 20.0
  gate_angle_deg: 45.0     # ... and a blob only matches a track it lies within this angle of, as its camera sees it
  cross_camera_range_frac: 0.35  # a camera new to a track may read its range this much off (each camera's size error is its own)
  confirm_hits: 3
  max_coast_s: 0.25        # drop a confirmed track after this long unseen
  flight_coast_s: 0.6      # ... but keep following a ball seen in flight this long: a lob leaves the top of a
                           # rear camera's picture in mid-flight and comes down on the robot from above
  flight_speed: 1.5        # m/s: a track moving at least this fast ...
  flight_travel_m: 0.15    # ... that has also moved this far ACROSS the line of sight counts as a ball in flight.
                           # (Along the line of sight proves nothing: range comes from the blob's size and jitters.)
  tentative_coast_s: 0.12
  max_tracks: 24           # things followed at once, clutter included (balls lying about, patches of noise). When all
                           # are taken a new blob replaces the weakest track; a ball seen in flight is never replaced
  max_range_m: 8.0
  use_drag: true
  # Straight behind the robot the rear cameras see only 30 degrees above the horizontal, and a lob is above
  # that a tenth of a second after it is thrown. A ball they saw twice, climbing clearly (two_look_min_climb_deg)
  # and hardly turning, is kept this long and judged on those two looks if no third comes. [] = off
  two_look_cameras: [elp_left, elp_right]
  two_look_min_bearing_deg: 150.0   # ... and only within this of straight behind (bearing from the nose, 180 = behind),
                           # with the second look in the top strip of the picture (cameras.<name>.top_strip, 0.22)
  two_look_min_climb_deg: 3.0
  two_look_coast_s: 0.35

threat:
  horizon_s: 1.6
  step_s: 0.01
  min_hits: 3
  min_age_s: 0.04
  min_closing_speed: 1.0   # m/s toward the robot, after removing the robot's own speed; a still object never passes this
  max_closing_speed: 15.0  # faster than anyone throws: a tracking glitch
  min_range_m: 0.25
  min_ball_speed: 1.5      # m/s over the ground; slower than this is a still object, not a throw
  judge_rising_balls: true # a lob is not closing in while it climbs: judge a ball in flight by where its arc comes
                           # down even before it approaches (decides high lobs about 0.3 s sooner in simulation)
  margin_m: 0.05           # clearance wanted between ball surface and body outline
  k_sigma: 1.5
  sigma_cap_m: 0.45
  use_bearing: true        # judge a ball by how its DIRECTION moves (climbing elevation, steady azimuth) rather than by
                           # how fast it grows in the picture; false = the earlier, size-based way
  bearing_max_closing_speed: 6.5   # m/s. A ball coming faster than this from 2.5 m arrives in under 0.36 s, less than
                           # the robot needs to get clear; and the slower the limit, the less a still thing's
                           # flicker can pass for a climb
  bearing_pool: []         # groups of cameras whose looks are put together for the direction fit, e.g.
                           # [[elp_left, elp_right]]. Off: two cameras that disagree by a degree in elevation make a
                           # still ball "climb" when the looks pass from one to the other (two false dodges in the
                           # overnight replay of 2026-11-27), and in simulation pooling added almost nothing
  two_look_wait_s: 0.07    # a two-look ball (tracker.two_look_cameras) is judged once a third look is this long overdue
  unseen_fire_s: 0.12      # a threatening ball that climbed out of the top of a rear picture and has been out of sight
                           # this long is dodged without waiting for a surer estimate. (Only then: a ball that just
                           # stops being seen mid-picture was hidden by a hand, and the estimate is waited for.)
  unseen_fire_min_bearing_deg: 110.0  # ... only that far round from the nose: nearer the front the fisheye sees above the rear cameras
  min_span_s: 0.045        # the three looks must span at least this long
  min_climb: 0.02          # tan(elevation) must have risen at least this much over the looks (about 1.1 degrees)
  loom_min: 0.15           # where the ball should have come nearer by this share of its range between the looks ...
  loom_support: 0.45       # ... its size must show at least this share of that approach (a ball lifted by hand does not)
  camera_support: 0.4      # an approach must also show within ONE camera's own pictures, at this share of the speed all
                           # cameras together give. Cameras that disagree about a still ball's range look, together,
                           # like a ball rushing in (a ball handled beside the robot "dodged", 2026-11-26). 0 = off
  sigma_lat_max_m: 0.20    # do not fire early while the sideways prediction is this vague
  confirm_cycles: 2        # consecutive threat verdicts needed
  trigger_margin_s: 0.60   # fire once time-to-contact <= time needed + this (0.3 waited longer for a better estimate;
                           # with a robot slower than assumed, 0.6 dodged more high lobs in simulation, no more false dodges)
  min_tau_s: 0.05          # too late to matter

escape:
  # Speeds actually commanded. The walking policy accepts |vx| <= 1.5, |vy| <= 0.5.
  # Start at these values; raise vx toward 1.5 once tools/step_response.py shows
  # the robot stays upright.
  vx_forward: 1.0
  vx_backward: 0.8
  vy: 0.5
  component_min: 0.25      # ignore an axis that contributes less than this share of the escape direction
  diagonal_scale: 0.8      # when a dodge uses both axes at once, both speeds are multiplied by this. The full
                           # diagonal (1.0 with 0.5) is the move that trips the robot on hardwood; 1.0 = no reduction
  accel_lag_s: 0.20        # first-order lag of the walking response; from tools/step_response.py
  react_s: 0.12            # delay from sending the command to the robot starting to move (mux tick + policy step + legs)
  center_deadband_m: 0.04  # |miss| below this = dead centre: side chosen by free space / preference
  extra_m: 0.12            # travel beyond the bare minimum
  max_displacement_m: 0.40
  min_duration_s: 0.25
  max_duration_s: 0.80     # hard cap on one burst
  ramp_out_s: 0.20         # after the burst the command eases to zero over this long instead of stopping dead
  hold_past_arrival_s: 0.15  # never keep moving longer than this after the ball should have arrived
  along_track: false       # stretch: run under/away from steep lobs in the front and rear cones
  along_track_min_descent_deg: 45.0
  free_space_needed_m: 0.6

fsm:
  refractory_s: 1.0        # after a dodge, the ball just dodged cannot start another for this long (a different ball can)
  second_ball_min_range_m: 1.2   # ... a different ball counts only if first seen at least this far away: not the one dodged,
                                 # picked up again bouncing or by another camera. A second ball 0.8-1.6 s after the first was
                                 # untouched in 28-73 % of simulated tries while every ball waited out the pause; 85-95 % now (2026-11-27)
  recover_min_s: 0.30
  recover_max_s: 1.50
  level_tilt_deg: 20.0
  still_gyro_rad_s: 0.6
  abort_tilt_deg: 40.0
  report_undodged: true    # report a "throw_seen" event for a ball seen in flight that did not lead to a dodge
  undodged_min_travel_m: 0.5   # ... if it was seen to move at least this far across the line of sight

node:
  cmd_topic: /dodge_cmd_vel
  cmd_rate_hz: 50.0        # the walking policy reads commands 50 times a second; the first command of a dodge goes out at once
  camera_processes: true   # each camera is captured, decoded and searched in a process of its own (one core each),
                           # so no camera waits for another or for the node. false = threads of the node, as before
                           # 2026-11-26 (then the cameras queue behind each other: far slower on the Pupper)
  opencv_threads: 1        # OpenCV worker threads per camera; the cameras already run one process each
  imu_rate_hz: 100.0       # IMU samples used per second; the rest are let go on arrival (0 = use every one)
  settle_s: 1.5            # a rear camera reports no blobs for this long after it is opened or sent its settings:
                           # its colours shift for a moment, and a still ball then looks like one coming closer
  cast_limit: 1.8          # a rear camera whose picture keeps one colour channel this many times another is not
                           # applying its white balance: its settings are sent again (0 = never)
  imu_topic: /imu_sensor_broadcaster/imu
  estop_topic: /emergency_stop
  free_space_topic: /free_space      # std_msgs/Float32MultiArray: clearance (m) per equal sector, starting at straight ahead, counter-clockwise
  walking_controllers: [gemini_walk, neural_controller_default, neural_controller_default_alt, neural_controller, neural_controller_student, neural_controller_three_legged]
  require_active_controller: true
  # Throw recorder: every dodge, every throw that was seen but not dodged, and every manual save is kept
  # with the camera frames and timings from event_buffer_s before to event_post_s after. A saved throw takes
  # roughly 30-60 MB on the SD card with these values (three cameras, full-size pictures).
  event_buffer_s: 2.0
  event_post_s: 1.2
  event_dir: data/throws
  record_undodged: true    # also save throws that were seen but not dodged
  min_free_gb: 1.5         # stop saving throws when the SD card has less free space than this
  min_record_gap_s: 4.0    # at most one recording of an undodged throw this often
